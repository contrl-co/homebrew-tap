name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  formula:
    name: Formula integrity
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate formula and release artifacts
        run: scripts/validate_formula.sh

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan committed history
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --source=/repo --redact --no-banner

  gate:
    name: Gate summary
    if: always()
    needs: [formula, secrets]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every gate
        env:
          FORMULA_RESULT: ${{ needs.formula.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
        run: |
          set -euo pipefail
          test "$FORMULA_RESULT" = success
          test "$SECRETS_RESULT" = success
